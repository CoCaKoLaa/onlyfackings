<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administración — ONLYFACKINGS</title>
<link rel="stylesheet" href="tema-dorado.css">
<style>
.adm { padding: 2.5rem 0 4rem; }
.adm h1 { margin: 0 0 1.5rem; font: 2rem var(--display); color: var(--naranja); }
.adm label { display: block; margin: .8rem 0 .3rem; color: var(--texto-suave); font-size: .9rem; }
.adm input { width: 100%; max-width: 380px; padding: .7rem .8rem; background: var(--carbon); border: 1px solid var(--linea); color: var(--texto); font: inherit; }
.tabs { display: flex; gap: .5rem; margin: 0 0 1.5rem; flex-wrap: wrap; }
.tabs button.on { background: var(--dorado); color: #000; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--linea); vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--dorado-claro); font-weight: 600; }
.tag { color: #000; background: var(--naranja); padding: .1rem .5rem; font-size: .8rem; font-weight: 700; }
.err { color: var(--naranja); min-height: 1.4rem; }
.tablewrap { overflow-x: auto; }
button.btn { font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="logo">ONLYFACKINGS · Administración</span>
  <nav class="nav"><span id="quien"></span><button class="btn small ghost" id="salir" hidden>Salir</button></nav>
</div></header>

<main class="wrap adm">
  <section id="login" style="border:0;padding:0">
    <h1>Acceso</h1>
    <label for="em">Correo</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn" id="entrar">Entrar</button>
  </section>

  <section id="panel" hidden style="border:0;padding:0">
    <h1>Panel</h1>
    <div class="tabs" role="tablist">
      <button class="btn ghost small on" data-t="usuarios">Usuarios</button>
      <button class="btn ghost small" data-t="denuncias">Denuncias</button>
      <button class="btn ghost small" data-t="kyc">Verificaciones de creadores</button>
      <button class="btn ghost small" data-t="baneados">Baneados</button>
    </div>
    <div id="vista"></div>
    <p class="err" id="perr" role="alert"></p>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
